<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonynotes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Anonynotes</h1>
            <p class="subtitle">Secure. Anonymous. Simple.</p>
        </header>

        <main class="container">
            <div class="search-container">
                <div class="input-wrapper">
                    <input type="text" id="searchId" placeholder="Enter Note ID">
                    <button class="search-button" onclick="searchNote()">
                        <span>Search</span>
                    </button>
                </div>
            </div>

            <div class="note-container">
                <textarea id="noteContent" placeholder="Write your secure note here..."></textarea>
            </div>

            <div class="button-group">
                <button id="createButton" class="primary-button" onclick="createNote()">
                    <span>Create Note</span>
                </button>
                <button id="saveButton" class="success-button" onclick="saveNote()" style="display: none;">
                    <span>Save Changes</span>
                </button>
                <button id="deleteButton" class="danger-button" onclick="deleteNote()" style="display: none;">
                    <span>Delete Note</span>
                </button>
                <button id="panicButton" class="warning-button" onclick="encryptNote()" style="display: none;">
                    <span>Panic! (Encrypt)</span>
                </button>
                <button id="decryptButton" class="info-button" onclick="decryptNote()" style="display: none;">
                    <span>Decrypt Note</span>
                </button>
            </div>

            <div id="message" class="message"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
